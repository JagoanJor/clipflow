<div class="login-page">

    <div class="login-background">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
    </div>

    <main class="login-container">

        <div class="brand">

            <img src="assets/Neon Ribbon Play Emblem.png" alt="ClipFlow Logo" class="logo" />

            <span>ClipFlow</span>
        </div>

        <section class="login-card">

            <div class="login-header">
                <h1>Welcome back</h1>

                <p>
                    Turn your videos into engaging short-form content.
                </p>
            </div>

            <form class="login-form" (ngSubmit)="login()">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="you@example.com"
                        autocomplete="email">

                </div>

                <div class="form-group">

                    <div class="label-row">
                        <label for="password">
                            Password
                        </label>

                        <button type="button" class="forgot-button">
                            Forgot password?
                        </button>
                    </div>

                    <input id="password" type="password" name="password" [(ngModel)]="password"
                        placeholder="Enter your password" autocomplete="current-password">

                </div>

                <button type="submit" class="primary-button" [disabled]="!email || !password">
                    Login
                </button>

            </form>

            <div class="divider">
                <span></span>
                <p>or</p>
                <span></span>
            </div>

            <button type="button" class="google-button" (click)="loginWithGoogle()">

                <span class="google-icon">
                    G
                </span>

                <span>
                    Continue with Google
                </span>

            </button>

            <div class="signup">
                <span>Don't have an account?</span>

                <button type="button">
                    Sign up
                </button>
            </div>

        </section>

        <p class="login-footer">
            © 2026 ClipFlow
        </p>

    </main>

</div>
